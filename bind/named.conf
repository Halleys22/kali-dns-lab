options {
    directory ".";
    listen-on port 5300 { 127.0.0.1; };
    listen-on-v6 { none; };
    allow-query { 127.0.0.1; };
    allow-recursion { 127.0.0.1; };
    allow-transfer { none; };
    recursion yes;
    dnssec-validation auto;
    pid-file none;
    session-keyfile none;
    response-policy { zone "rpz-lab"; } qname-wait-recurse no;
};

controls {};

zone "aula.test" {
    type primary;
    file "bind/db.aula.test";
};

zone "rpz-lab" {
    type primary;
    file "bind/db.rpz-lab";
    allow-query { none; };
};
