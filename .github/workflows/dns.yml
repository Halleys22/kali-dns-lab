name: Comprobaciones DNS

on: [push, pull_request]

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar BIND y dig
        run: |
          sudo apt-get update
          sudo apt-get install -y bind9 bind9-utils dnsutils
      - name: Verificar la zona y el bloqueo RPZ
        run: bash comprobar.sh
